<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 880 220" fill="none" role="img" aria-label="psa — le monde chico">
  <defs>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#4cd42c" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <radialGradient id="vig" cx="30%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#0d0f0c"/>
      <stop offset="100%" stop-color="#08080a"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="880" height="220" rx="18" fill="url(#vig)"/>
  <rect width="880" height="220" rx="18" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="879" height="219" rx="18" fill="none" stroke="#4cd42c" stroke-opacity="0.22"/>

  <g transform="translate(78,52) scale(2.55)" filter="url(#glow)">
    <g stroke="#4cd42c" stroke-width="1.5" stroke-linecap="round">
      <line x1="10" y1="23" x2="24" y2="12"/>
      <line x1="24" y1="12" x2="40" y2="16"/>
      <line x1="40" y1="16" x2="48" y2="30"/>
      <line x1="48" y1="30" x2="38" y2="40"/>
      <line x1="38" y1="40" x2="22" y2="36"/>
      <line x1="22" y1="36" x2="10" y2="23"/>
      <line x1="48" y1="30" x2="60" y2="34"/>
    </g>
    <g fill="#08080a" stroke="#4cd42c" stroke-width="1.4">
      <circle cx="10" cy="23" r="3.4"/>
      <circle cx="40" cy="16" r="3.4"/>
      <circle cx="60" cy="34" r="3"/>
    </g>
  </g>

  <text x="335" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, 'Helvetica Neue', Arial, sans-serif" font-style="italic" font-weight="800" font-size="82" letter-spacing="-2" fill="#4cd42c" filter="url(#softglow)">psa</text>

  <text x="337" y="156" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, monospace" font-weight="700" font-size="21" letter-spacing="0.5" fill="#9dee86">C<tspan baseline-shift="sub" font-size="15" fill="#4cd42c">17</tspan>H<tspan baseline-shift="sub" font-size="15" fill="#4cd42c">19</tspan>NO<tspan baseline-shift="sub" font-size="15" fill="#4cd42c">3</tspan></text>

  <text x="337" y="182" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-weight="600" font-size="11" letter-spacing="4.5" fill="#5a5a66">LE MONDE CHICO</text>
</svg>
